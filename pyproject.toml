[tool.poetry]
name = "taxonomyml"
version = "1.3.0"
description = "Develop high-level website taxonomies from Search Console data or CSV files."
license = "MIT"
authors = ["taxonomyml contributors"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.9,<3.15"
sentence-transformers = "^3.0"
loguru = "^0.7.2"
openai = "^1.50"
numpy = ">=1.26,<2.0"
scikit-learn = "^1.5"
nltk = "^3.9"
kneed = "^0.8.5"
pandas = "^2.2"
google-api-python-client = "^2.140"
python-dotenv = "^1.0"
tiktoken = "^0.7"
llvmlite = "^0.43"
umap-learn = "^0.5.6"
torch = "^2.2"
tabulate = "^0.9.0"
google-auth-oauthlib = "^1.2"
tenacity = "^8.5"
streamlit = "^1.36"

[tool.poetry.group.dev.dependencies]
black = "^23.7.0"
pre-commit = "^3.3.3"
ruff = "^0.0.278"

[tool.ruff]
select = ["E", "F", "I", "N", "C90", "RUF200"]
ignore = ["E501"]
src = ["src"]
fix = true

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "E402"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
